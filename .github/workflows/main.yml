name: Fortran code update

on:
  push:
    branches:
      - main
  schedule:
      - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.9.0-devel-ubuntu24.04

    timeout-minutes: 360
    steps:
      - name: Set timezone
        run: ln -fs /usr/share/zoneinfo/Europe/Helsinki /etc/localtime

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y apt-transport-https ca-certificates gnupg software-properties-common wget
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | tee /etc/apt/trusted.gpg.d/kitware.gpg >/dev/null
          apt-add-repository 'deb https://apt.kitware.com/ubuntu/ noble main'
          apt-get update
          apt-get install -y cmake flex bison openmpi-bin libopenmpi-dev gfortran git python3 python3-numpy python3-pandas libhdf5-openmpi-dev hdf5-tools

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup
        shell: bash
        run: |
          git clone --recurse-submodules --remote https://github.com/pencil-code/pencil-code.git
          cd pencil-code

      - name: Samples
        shell: bash
        run: |
          cd pencil-code
          export PENCIL_USER=GPU_AUTOTEST
          source sourceme.sh || true
          cd src/astaroth
          # run over the samples of the GPU auto-test (@gpu_tests in bin/pc_auto-test),
          # rebuilding each one from scratch after the update
          python3 update_fortran.py -p $PENCIL_HOME --gpu-autotest --verify

      # The Astaroth build writes its output only to src/astaroth/ac_build.log, so show it when the build breaks
      - name: Print Astaroth build logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob globstar
          logs=(pencil-code/samples/**/src/astaroth/ac_build.log)
          if [ ${#logs[@]} -eq 0 ]; then echo "No ac_build.log found"; exit 0; fi
          # newest last: that is the sample that was being built when the step failed
          for log in $(ls -tr "${logs[@]}"); do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
          newest=$(ls -t "${logs[@]}" | head -1)
          echo "::error file=$newest::Last 60 lines of $newest"
          tail -n 60 "$newest"

      - name: Upload Astaroth build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ac_build-logs
          path: pencil-code/samples/**/src/astaroth/ac_build.log
          if-no-files-found: ignore

      - name: CommitAndPush
        continue-on-error: true
        shell: bash
        run: |
          cd pencil-code
          git config --global user.email "touko.puro@aalto.fi"
          git config --global user.name "ToxPuro"
          git remote set-url origin https://ToxPuro:${{ secrets.PENCIL_PASSWORD }}@pencil-code.org/git/
          git add src/*.f90
          git add src/cparam_enum.h
          git add src/special/*.f90
          git add src/astaroth/DSL
          git commit -m"Automatic commit to keep code GPU-enabled"
          git status -uno
          git pull
          git push




